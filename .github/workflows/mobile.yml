name: Mobile

# Quality gates for the Expo app in mobile/: lint, typecheck, Jest, expo-doctor
# and a bundle export for both platforms. Runs on pushes to main and on pull
# requests that touch mobile/ (or this workflow). The same checks run locally
# from mobile/ via `npm run lint`, `npm run typecheck` and `npm test`.
on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Jest
        run: npm test -- --ci

      - name: expo-doctor
        # Some checks query Expo's servers and the npm registry, so a network
        # blip or an upstream SDK-version advisory would fail the build for
        # reasons outside this repo. Report it, but do not block.
        continue-on-error: true
        run: npx expo-doctor

      - name: Export iOS bundle
        run: npx expo export --platform ios

      - name: Export Android bundle
        run: npx expo export --platform android
