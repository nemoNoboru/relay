name: Go tests

# Runs the Go quality gates on every push to main and every pull
# request: gofmt, go vet, staticcheck, and the full test suite with the
# race detector. The same gates run locally via `make check` and a fast
# subset via pre-commit (.pre-commit-config.yaml).
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: unformatted files"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: go test -race
        run: go test -race ./...
