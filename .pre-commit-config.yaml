# Pre-commit mirrors the CI quality gates so they run before a commit.
#
# Backend (backend/): ruff check + format, uv lock, ty, and the
# import-linter contracts. The full gate (including pytest on SQLite and
# Postgres) runs in CI: .github/workflows/backend-test.yml.
#
# Setup:
#   uv tool install pre-commit
#   pre-commit install
#
# The backend hooks need only uv; the ty and lint-imports hooks run through `uv run`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock
        files: ^backend/(pyproject\.toml|uv\.lock)$
        args: [--directory, backend]
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --directory backend ty check
        language: system
        pass_filenames: false
        files: ^backend/
      - id: lint-imports
        name: import-linter
        entry: uv run --directory backend lint-imports
        language: system
        pass_filenames: false
        files: ^backend/
