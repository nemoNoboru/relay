# Deploys relay.mansus.org via the k3s app platform
# (docs: nemoNoboru/k3s-hetzner-gitops docs/app-platform/).

# image: ghcr.io/mansus-org/relay (chart default for release "relay").

port: 8080
# The image ENTRYPOINT already runs "relay node ..."; set command so args don't double up.
command: [relay, node]
args: [--name, relay, --data, /data, --listen, ":8080", --admin-token, $(RELAY_ADMIN_TOKEN)]

env:
  RELAY_ADMIN_TOKEN: { secretKeyRef: { name: relay-admin-token, key: admin-token } }

# Same ciphertext as deploy/relay/sealed-secret.yaml (sealed for relay/relay-admin-token).
sealedSecrets:
  - name: relay-admin-token
    encryptedData:
      admin-token: 

ingress:
  host: relay.mansus.org

persistence:
  enabled: true
  size: 10Gi

healthCheck:
  path: /healthz

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: "1", memory: 256Mi }

# Image user is "relay" (uid 100, gid 101).
podSecurityContext: { runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, fsGroup: 101 }
securityContext:
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
  seccompProfile: { type: RuntimeDefault }
terminationGracePeriodSeconds: 45
