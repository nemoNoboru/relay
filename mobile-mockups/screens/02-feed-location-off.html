<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>02 Feed, location off</title>
<meta name="viewport" content="width=390">
<link rel="stylesheet" href="../../web/fonts/fonts.css">
<link rel="stylesheet" href="../shared.css">
</head><body>
<div class="phone">
  <div class="statusbar dark"><span>9:41</span><span class="sys"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="batt"></span></span></div>
  <header class="poster-head">
    <div class="ph-top"><span class="logo sm">R</span><span class="wordmark">Relay</span><span class="avatar sm c3">A</span></div>
  </header>
  <main class="screen" style="padding:0 20px">
    <div class="grid-paper" style="position:relative;height:250px;margin:24px 22px 0 4px;border:3px solid var(--ink)">
      <span class="geo-ring" style="width:176px;height:176px;left:40px;top:28px"></span>
      <span class="geo-sun" style="width:124px;height:124px;left:66px;top:54px"></span>
      <span class="geo-wedge" style="width:250px;height:96px;left:-28px;top:132px"></span>
      <span class="geo-bar" style="width:440px;height:18px;left:-60px;top:210px"></span>
      <i class="ic ic-pin" style="position:absolute;left:108px;top:90px;width:40px;height:40px;color:var(--ink)"></i>
      <span class="vtag" style="position:absolute;right:-16px;top:24px">Relay</span>
      <span class="stamp red" style="position:absolute;left:-10px;top:-14px">Location off</span>
    </div>
    <div class="kicker" style="margin-top:34px">Your neighbourhood, your feed</div>
    <h1 class="display" style="font-size:56px;margin-top:12px">See what's<br><span class="hot">near you</span></h1>
    <p style="margin-top:12px;font-size:17px;color:var(--ink-2)">Turn on location and Relay shows posts from people within 10 km of you.</p>
    <a class="btn primary block" style="margin-top:20px">Enable location</a>
    <a class="btn ghost block" style="margin-top:2px">Open Settings</a>
  </main>
  <nav class="tabbar">
    <a class="tab active"><i class="ic ic-feed"></i>Feed</a>
    <a class="tab"><i class="ic ic-communities"></i>Communities</a>
    <a class="tab"><i class="ic ic-events"></i>Events</a>
    <a class="tab"><i class="ic ic-settings"></i>Settings</a>
  </nav>
  <div class="home-ind"></div>
</div>
</body></html>
