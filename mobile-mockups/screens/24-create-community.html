<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>24 Create community</title>
<meta name="viewport" content="width=390">
<link rel="stylesheet" href="../../web/fonts/fonts.css">
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="../communities.css">
</head><body>
<div class="phone">
  <div class="statusbar dark"><span>9:41</span><span class="sys"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="batt"></span></span></div>
  <header class="navbar large" style="overflow:hidden;padding-top:6px;padding-bottom:16px">
    <span class="geo-ring" style="width:150px;height:150px;right:-40px;top:-30px;color:var(--paper)"></span>
    <span class="geo-sun" style="width:84px;height:84px;right:30px;top:20px"></span>
    <div class="navbar-title" style="position:relative">Communities</div>
  </header>
  <main class="screen grid-paper"></main>
  <div class="scrim"></div>
  <div class="sheet tall">
    <div class="sheet-head">
      <span class="geo-sun" style="width:90px;height:90px;right:62px;top:-46px;z-index:0"></span>
      <span class="geo-wedge flip" style="width:90px;height:34px;right:-10px;top:50px;z-index:0"></span>
      <div class="navbar-row"><div class="kicker on-dark">Start a group</div><a class="navbar-btn ink" style="margin-right:-4px"><i class="ic ic-close"></i></a></div>
      <div class="sheet-title" style="margin-top:-6px">New <span class="ochre">community</span></div>
    </div>
    <div class="field" style="margin-top:4px"><label class="label">Name</label><div class="input">Vila Madalena Cultura</div></div>
    <div class="field"><label class="label">Description</label><div class="textarea" style="min-height:72px">Shows, feiras e exposições no bairro.</div></div>
    <div class="switch-row" style="margin-top:14px"><div class="row-main"><div class="row-title">Use my current location</div><div class="row-sub" style="display:flex;align-items:center;gap:4px"><i class="ic ic-pin" style="width:14px;height:14px"></i>Pinheiros, São Paulo</div></div><span class="toggle on"></span></div>
    <div class="field" style="margin-top:6px"><div style="display:flex;justify-content:space-between;align-items:center"><label class="label">Radius</label><span class="stamp red" style="height:26px">5 km</span></div>
      <div class="slider"><div class="track"></div><div class="fill"></div><div class="knob"></div></div>
      <div class="slider-ends"><span>1 km</span><span>50 km</span></div></div>
    <div class="switch-row"><div class="row-main"><div class="row-title">Allow pseudonyms</div></div><span class="toggle on"></span></div>
    <a class="btn primary block" style="margin-top:12px">Create</a>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
