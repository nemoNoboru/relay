<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>24 Create community</title>
<meta name="viewport" content="width=390">
<link rel="stylesheet" href="../../web/fonts/fonts.css">
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="../communities.css">
</head><body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="sys"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="batt"></span></span></div>
  <header class="navbar large">
    <div class="navbar-row"><div class="navbar-title">Communities</div></div>
  </header>
  <main class="screen"></main>
  <div class="scrim"></div>
  <div class="sheet tall">
    <div class="sheet-grab"></div>
    <div class="navbar-row"><div class="sheet-title">New community</div><a class="navbar-btn ink"><i class="ic ic-close"></i></a></div>
    <div class="field" style="margin-top:6px"><label class="label">Name</label><div class="input">Vila Madalena Cultura</div></div>
    <div class="field"><label class="label">Description</label><div class="textarea" style="min-height:72px">Shows, feiras e exposições no bairro.</div></div>
    <div class="switch-row" style="margin-top:8px"><div class="row-main"><div class="row-title">Use my current location</div><div class="row-sub" style="display:flex;align-items:center;gap:4px"><i class="ic ic-pin" style="width:14px;height:14px"></i>Pinheiros, São Paulo</div></div><span class="toggle on"></span></div>
    <div class="field" style="margin-top:6px"><div style="display:flex;justify-content:space-between;align-items:baseline"><label class="label">Radius</label><b style="font-weight:700">5 km</b></div>
      <div class="slider"><div class="track"></div><div class="fill"></div><div class="knob"></div></div>
      <div class="slider-ends"><span>1 km</span><span>50 km</span></div></div>
    <div class="switch-row"><div class="row-main"><div class="row-title">Allow pseudonyms</div></div><span class="toggle on"></span></div>
    <a class="btn primary block" style="margin-top:10px">Create</a>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
