<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>03 Compose</title>
<meta name="viewport" content="width=390">
<link rel="stylesheet" href="../../web/fonts/fonts.css">
<link rel="stylesheet" href="../shared.css">
</head><body>
<div class="phone">
  <div class="statusbar dark"><span>9:41</span><span class="sys"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="batt"></span></span></div>
  <header class="navbar large" style="overflow:hidden;padding-top:2px">
    <span class="geo-sun" style="width:120px;height:120px;right:-30px;top:52px"></span>
    <span class="geo-wedge flip" style="width:130px;height:50px;right:22px;top:92px"></span>
    <div class="navbar-row" style="position:relative">
      <a class="navbar-btn ink" style="margin-left:-6px">Cancel</a>
      <a class="btn primary sm" style="box-shadow:3px 3px 0 var(--ochre)">Post</a>
    </div>
    <div class="navbar-title" style="position:relative;margin-top:4px">New post</div>
    <div class="navbar-sub" style="position:relative">Within 10 km of Pinheiros</div>
  </header>
  <main class="screen pad">
    <div style="margin-top:16px"><div class="seg"><button class="on">Post</button><button>Event</button></div></div>
    <div style="display:flex;gap:12px;margin-top:18px">
      <span class="avatar c3">A</span>
      <div style="flex:1;min-height:112px;font-size:19px;line-height:1.42">Alguém quer dividir um táxi para o show no Cine Joia hoje à noite? Saio de Pinheiros por volta das 20h<span style="display:inline-block;width:3px;height:22px;background:var(--red);vertical-align:-4px;margin-left:2px"></span></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
      <span style="flex:1;height:6px;background:var(--paper-2);position:relative"><span style="position:absolute;left:0;top:0;bottom:0;width:22.4%;background:var(--ink)"></span></span>
      <span class="counter">112 / 500</span>
    </div>
    <div style="border-top:var(--line);margin-top:14px;padding-top:14px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:10px"><span class="label" style="width:112px">Where</span><span class="chip red"><i class="ic ic-pin"></i>Pinheiros, SP<i class="ic ic-close" style="width:13px;height:13px;margin-left:2px"></i></span></div>
      <div style="display:flex;align-items:center;gap:10px"><span class="label" style="width:112px">Community</span><span class="chip">Vizinhos de Pinheiros<i class="ic ic-chevron" style="width:13px;height:13px;transform:rotate(90deg)"></i></span></div>
    </div>
  </main>
  <div class="kb"></div>
  <div class="home-ind"></div>
</div>
