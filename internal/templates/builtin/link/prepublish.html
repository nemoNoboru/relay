<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New link — Relay</title>
<link rel="stylesheet" href="/_relay/template/runtime.css">
</head>
<body class="tpl">
<header class="tpl-bar">
  <a class="tpl-brand" href="/_relay/home.html"><span class="tpl-mark">R</span> RELAY</a>
  <span class="tpl-note">New link</span>
</header>
<div class="tpl-wrap">
  <section class="tpl-card">
    <span class="tpl-kicker">Link</span>
    <h1>Share a link</h1>
    <form id="form" class="tpl-form">
      <div class="tpl-field">
        <label for="url">Address</label>
        <input id="url" name="url" type="url" required placeholder="https://example.org/thing">
      </div>
      <div class="tpl-field">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" required maxlength="160" placeholder="What is it?">
      </div>
      <div class="tpl-field">
        <label for="note">Why share it</label>
        <textarea id="note" name="note" rows="5" maxlength="2000" placeholder="A line about why it is worth opening."></textarea>
      </div>
      <div class="tpl-actions">
        <button class="tpl-btn solid" type="submit" id="go">Publish link</button>
        <a class="tpl-btn" href="/_relay/home.html">Cancel</a>
      </div>
      <p class="tpl-error" id="error" hidden></p>
    </form>
  </section>
  <section class="tpl-preview">
    <h2>Preview</h2>
    <iframe class="tpl-frame" id="preview" title="Link preview"></iframe>
  </section>
</div>
<p class="tpl-foot"><a href="/_relay/publish.html">All publishing options</a> · The link is a static page on this node.</p>
<script type="module" src="./publish.js"></script>
</body>
</html>
