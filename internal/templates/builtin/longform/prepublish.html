<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New longform — Relay</title>
<link rel="stylesheet" href="/_relay/template/runtime.css">
<style>
  body.tpl{background:#fbfaf7;color:#1a1a1a}
  .tpl-card h1{font-family:Georgia,'Times New Roman',serif;text-transform:none;font-weight:700;letter-spacing:-.02em}
  .tpl-kicker{color:#777}
  .tpl-preview h2{font-family:Georgia,serif;text-transform:none;font-weight:700}
  .tpl-frame{box-shadow:8px 8px 0 #d8d4cc}
</style>
</head>
<body class="tpl">
<header class="tpl-bar">
  <a class="tpl-brand" href="/_relay/home.html"><span class="tpl-mark">R</span> RELAY</a>
  <span class="tpl-note">Longform</span>
</header>
<div class="tpl-wrap">
  <section class="tpl-card">
    <span class="tpl-kicker">Longform</span>
    <h1>Write the long read</h1>
    <form id="form" class="tpl-form">
      <div class="tpl-field">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" required maxlength="160" placeholder="The headline">
      </div>
      <div class="tpl-field">
        <label for="byline">Byline</label>
        <input id="byline" name="byline" type="text" maxlength="80" placeholder="Who wrote it?">
      </div>
      <div class="tpl-field">
        <label for="standfirst">Standfirst</label>
        <textarea id="standfirst" name="standfirst" rows="3" maxlength="400" placeholder="The line under the title."></textarea>
      </div>
      <div class="tpl-field">
        <label for="hero">Hero image</label>
        <input id="hero" name="hero" type="file" accept="image/*">
        <span class="hint">Optional. A wide image above the text.</span>
      </div>
      <div class="tpl-field">
        <label for="body">Body</label>
        <textarea id="body" name="body" rows="16" required maxlength="40000" placeholder="The piece. Blank lines make paragraphs; **bold**, *italic*, and [links](https://example.org) work."></textarea>
      </div>
      <div class="tpl-actions">
        <button class="tpl-btn solid" type="submit" id="go">Publish longform</button>
        <a class="tpl-btn" href="/_relay/home.html">Cancel</a>
      </div>
      <p class="tpl-error" id="error" hidden></p>
    </form>
  </section>
  <section class="tpl-preview">
    <h2>Preview</h2>
    <iframe class="tpl-frame" id="preview" title="Longform preview"></iframe>
  </section>
</div>
<p class="tpl-foot"><a href="/_relay/publish.html">All publishing options</a> · The long read is a static page on this node.</p>
<script type="module" src="./publish.js"></script>
</body>
</html>
