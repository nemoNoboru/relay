<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New carousel — Relay</title>
<link rel="stylesheet" href="/_relay/template/runtime.css">
</head>
<body class="tpl">
<header class="tpl-bar">
  <a class="tpl-brand" href="/_relay/home.html"><span class="tpl-mark">R</span> RELAY</a>
  <span class="tpl-note">New carousel</span>
</header>
<div class="tpl-wrap">
  <section class="tpl-card">
    <span class="tpl-kicker">Images carousel</span>
    <h1>Put up a sequence</h1>
    <form id="form" class="tpl-form">
      <div class="tpl-field">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" required maxlength="160" placeholder="A name for the set">
      </div>
      <div class="tpl-field">
        <label for="images">Images</label>
        <input id="images" name="images" type="file" accept="image/*" multiple required>
        <span class="hint">The first image becomes the cover in the feed. Keep the total under 64 MB.</span>
      </div>
      <div class="tpl-field">
        <label for="caption">Caption</label>
        <textarea id="caption" name="caption" rows="4" maxlength="2000" placeholder="Where, when, who — anything worth saying."></textarea>
      </div>
      <div class="tpl-actions">
        <button class="tpl-btn solid" type="submit" id="go">Publish carousel</button>
        <a class="tpl-btn" href="/_relay/home.html">Cancel</a>
      </div>
      <p class="tpl-error" id="error" hidden></p>
    </form>
  </section>
  <section class="tpl-preview">
    <h2>Preview</h2>
    <iframe class="tpl-frame" id="preview" title="Carousel preview"></iframe>
  </section>
</div>
<p class="tpl-foot"><a href="/_relay/publish.html">All publishing options</a> · Images are stored with the page on this node.</p>
<script type="module" src="./publish.js"></script>
</body>
</html>
