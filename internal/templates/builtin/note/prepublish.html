<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New note — Relay</title>
<link rel="stylesheet" href="/_relay/template/runtime.css">
</head>
<body class="tpl">
<header class="tpl-bar">
  <a class="tpl-brand" href="/"><span class="tpl-mark" aria-hidden="true"></span> RELAY</a>
  <span class="tpl-note">New note</span>
</header>
<div class="tpl-wrap">
  <section class="tpl-card">
    <span class="tpl-kicker">Note</span>
    <h1>Say something</h1>
    <form id="form" class="tpl-form">
      <div class="tpl-field">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" required maxlength="160" placeholder="A title for the note">
      </div>
      <div class="tpl-field">
        <label for="body">Body</label>
        <textarea id="body" name="body" rows="10" required maxlength="12000" placeholder="Write the note. Blank lines make paragraphs; **bold**, *italic*, and [links](https://example.org) work."></textarea>
        <span class="hint">Plain text with a little markdown</span>
      </div>
      <div class="tpl-actions">
        <button class="tpl-btn solid" type="submit" id="go">Publish note</button>
        <a class="tpl-btn" href="/">Cancel</a>
      </div>
      <p class="tpl-error" id="error" hidden></p>
    </form>
  </section>
  <section class="tpl-preview">
    <h2>Preview</h2>
    <iframe class="tpl-frame" id="preview" title="Note preview"></iframe>
  </section>
</div>
<p class="tpl-foot"><a href="/_relay/publish.html">All publishing options</a> · The note is a static page on this node.</p>
<script type="module" src="./publish.js"></script>
</body>
</html>
