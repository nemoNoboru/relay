<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New street radio — Relay</title>
<link rel="stylesheet" href="/_relay/template/runtime.css">
<style>
  body.tpl{background:#100a18;color:#f6f0ff}
  .tpl-bar{background:#000;border-bottom-color:#00e5ff}
  .tpl-mark{background:#ff2d95;color:#100a18}
  .tpl-note{color:#c8ff00}
  .tpl-card{background:#f6f0ff;color:#100a18;border-color:#000;box-shadow:10px 10px 0 #ff2d95}
  .tpl-kicker{color:#ff2d95}
  .tpl-card h1{font-family:Impact,'Arial Black',sans-serif;font-size:clamp(2.4rem,5vw,3.6rem);text-shadow:3px 3px 0 #00e5ff}
  .tpl-field label{color:#100a18}
  .tpl-btn.solid{background:#c8ff00;color:#100a18;border-color:#000}
  .tpl-preview h2{color:#c8ff00}
  .tpl-frame{border-color:#000;box-shadow:10px 10px 0 #00e5ff}
  .tpl-foot{color:#c8ff00}
  .tpl-foot a{border-bottom-color:#ff2d95}
</style>
</head>
<body class="tpl">
<header class="tpl-bar">
  <a class="tpl-brand" href="/_relay/home.html"><span class="tpl-mark">R</span> RELAY</a>
  <span class="tpl-note">Street radio</span>
</header>
<div class="tpl-wrap">
  <section class="tpl-card">
    <span class="tpl-kicker">Jet Set Radio</span>
    <h1>Tune the radio</h1>
    <form id="form" class="tpl-form">
      <div class="tpl-field">
        <label for="title">Station name</label>
        <input id="title" name="title" type="text" required maxlength="160" placeholder="A name for the broadcast">
      </div>
      <div class="tpl-field">
        <label for="description">Liner notes</label>
        <textarea id="description" name="description" rows="4" maxlength="2000" placeholder="What is this racket, and who is making it?"></textarea>
      </div>
      <div class="tpl-field">
        <label for="tracks">Audio files</label>
        <input id="tracks" name="tracks" type="file" accept="audio/*" multiple required>
        <span class="hint">One or more tracks. The whole post is capped at 64 MB.</span>
      </div>
      <div class="tpl-actions">
        <button class="tpl-btn solid" type="submit" id="go">Broadcast it</button>
        <a class="tpl-btn" href="/_relay/home.html">Cancel</a>
      </div>
      <p class="tpl-error" id="error" hidden></p>
    </form>
  </section>
  <section class="tpl-preview">
    <h2>On air</h2>
    <iframe class="tpl-frame" id="preview" title="Street radio preview"></iframe>
  </section>
</div>
<p class="tpl-foot"><a href="/_relay/publish.html">All publishing options</a> · Audio files are stored with the page on this node.</p>
<script type="module" src="./publish.js"></script>
</body>
</html>
