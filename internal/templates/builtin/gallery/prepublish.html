<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New gallery — Relay</title>
<link rel="stylesheet" href="/_relay/template/runtime.css">
</head>
<body class="tpl">
<header class="tpl-bar">
  <a class="tpl-brand" href="/"><span class="tpl-mark">R</span> RELAY</a>
  <span class="tpl-note">New gallery</span>
</header>
<div class="tpl-wrap">
  <section class="tpl-card">
    <span class="tpl-kicker">Gallery</span>
    <h1>Put up some photos</h1>
    <form id="form" class="tpl-form">
      <div class="tpl-field">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" required maxlength="160" placeholder="A name for the set">
      </div>
      <div class="tpl-field">
        <label for="images">Images</label>
        <input id="images" name="images" type="file" accept="image/*" multiple required>
        <span class="hint">Pick several at once. The node caps the whole post at 64 MB.</span>
      </div>
      <div class="tpl-field">
        <label for="caption">Caption</label>
        <textarea id="caption" name="caption" rows="4" maxlength="2000" placeholder="Where, when, who — anything worth saying."></textarea>
      </div>
      <div class="tpl-actions">
        <button class="tpl-btn solid" type="submit" id="go">Publish gallery</button>
        <a class="tpl-btn" href="/">Cancel</a>
      </div>
      <p class="tpl-error" id="error" hidden></p>
    </form>
  </section>
  <section class="tpl-preview">
    <h2>Preview</h2>
    <iframe class="tpl-frame" id="preview" title="Gallery preview"></iframe>
  </section>
</div>
<p class="tpl-foot"><a href="/_relay/publish.html">All publishing options</a> · Images are stored with the page on this node.</p>
<script type="module" src="./publish.js"></script>
</body>
</html>
