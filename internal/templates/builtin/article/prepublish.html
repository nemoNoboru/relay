<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New article — Relay</title>
<link rel="stylesheet" href="/_relay/template/runtime.css">
</head>
<body class="tpl">
<header class="tpl-bar">
  <a class="tpl-brand" href="/"><span class="tpl-mark" aria-hidden="true"></span> RELAY</a>
  <span class="tpl-note">New article</span>
</header>
<div class="tpl-wrap">
  <section class="tpl-card">
    <span class="tpl-kicker">Article</span>
    <h1>Write it out</h1>
    <form id="form" class="tpl-form">
      <div class="tpl-field">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" required maxlength="160" placeholder="The headline">
      </div>
      <div class="tpl-field">
        <label for="standfirst">Standfirst</label>
        <textarea id="standfirst" name="standfirst" rows="3" maxlength="400" placeholder="One or two lines under the title."></textarea>
      </div>
      <div class="tpl-field">
        <label for="hero">Hero image</label>
        <input id="hero" name="hero" type="file" accept="image/*">
        <span class="hint">Optional. One image above the text.</span>
      </div>
      <div class="tpl-field">
        <label for="body">Body</label>
        <textarea id="body" name="body" rows="14" required maxlength="30000" placeholder="The piece. Blank lines make paragraphs; **bold**, *italic*, and [links](https://example.org) work."></textarea>
      </div>
      <div class="tpl-actions">
        <button class="tpl-btn solid" type="submit" id="go">Publish article</button>
        <a class="tpl-btn" href="/">Cancel</a>
      </div>
      <p class="tpl-error" id="error" hidden></p>
    </form>
  </section>
  <section class="tpl-preview">
    <h2>Preview</h2>
    <iframe class="tpl-frame" id="preview" title="Article preview"></iframe>
  </section>
</div>
<p class="tpl-foot"><a href="/_relay/publish.html">All publishing options</a> · The article is a static page on this node.</p>
<script type="module" src="./publish.js"></script>
</body>
</html>
