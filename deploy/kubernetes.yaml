# Relay node on Kubernetes — install in one command:
#
#   kubectl apply -f https://raw.githubusercontent.com/nemoNoboru/relay/main/deploy/kubernetes.yaml
#
# This creates a "relay" namespace, a one-replica StatefulSet with a
# PersistentVolumeClaim (so the node's data survives pod restarts), and a
# ClusterIP Service that fronts its HTTP port. The node serves plain HTTP
# on :8080; terminate TLS at the cluster edge (see deploy/ingress.yaml) or
# in a reverse proxy in front of it.
#
# The node name ("--name relay") is the first path segment of every site's
# address: a site "docs" is served at /relay/docs/. Change it to suit your
# node; it must match [a-z0-9-] and be at most 63 characters.
apiVersion: v1
kind: Namespace
metadata:
  name: relay
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: relay
  namespace: relay
  labels:
    app.kubernetes.io/name: relay
spec:
  serviceName: relay
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay
    spec:
      securityContext:
        runAsNonRoot: true
        # The image runs as the unprivileged "relay" user (Alpine's first
        # system UID/GID, 100). Give the /data volume that group so the pod
        # can write its state (sites, admin token) to it.
        fsGroup: 100
      terminationGracePeriodSeconds: 45
      containers:
        - name: relay
          # Pin to a version tag (e.g. v0.1.0) once releases exist.
          image: ghcr.io/nemoNoboru/relay:latest
          args:
            - node
            - --name
            - relay
            - --data
            - /data
            - --listen
            - :8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: relay
  labels:
    app.kubernetes.io/name: relay
spec:
  selector:
    app.kubernetes.io/name: relay
  ports:
    - name: http
      port: 80
      targetPort: http
